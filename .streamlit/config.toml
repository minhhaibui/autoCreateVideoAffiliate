# Theme — see design.md (locked design system for the WebUI).
# Mirrored in webui/.streamlit/config.toml for users who launch from webui/.

[browser]
gatherUsageStats = false

[client]
# Hide the Deploy button and developer menu items — the audience is a
# non-technical creator; the toolbar noise reads as "did I break something?".
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#D64F35"
backgroundColor = "#FAF7EF"
secondaryBackgroundColor = "#F2EDE0"
textColor = "#23252C"
linkColor = "#0B7285"
borderColor = "#E5DECC"
font = "'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
headingFont = "'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
baseRadius = "12px"
buttonRadius = "999px"
codeBackgroundColor = "#F2EDE0"
